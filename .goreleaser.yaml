version: 2
project_name: soulstream-shell

builds:
  - main: ./cmd/soulstream-shell
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  filters:
    exclude: ["^docs", "^test", "^chore"]

release:
  github:
    owner: impire-io
    name: soulstream-shell
  draft: false
  # A tag carrying a hyphen is a candidate, not a release — the same rule
  # the product and the sign-in surface already publish under, so an rc
  # here reads as an rc everywhere it is listed.
  prerelease: auto
